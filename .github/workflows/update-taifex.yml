name: Update TAIFEX data

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily update
        run: python scripts/taifex_daily_update.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add futures-options/margin-table.md futures-options/institutional-positions.md futures-options/txo-chips.md scripts/state/taifex_snapshot.json
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
          else
            git commit -m "chore: daily TAIFEX data update"
            git push
          fi