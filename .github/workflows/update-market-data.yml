name: Update market data

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update global indices page
        run: python scripts/global_indices_update.py

      - name: Update TWSE data page
        run: python scripts/twse_daily_update.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add futures-options/global-indices.md futures-options/twse-data.md scripts/state/global_indices_snapshot.json
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
          else
            git commit -m "chore: daily market data update"
            git push
          fi
