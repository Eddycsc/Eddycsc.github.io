name: Update market data

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update global indices page
        run: python scripts/global_indices_update.py

      # One source being down must not throw away the page that did update:
      # both steps run, the job still goes red, and whatever succeeded is committed.
      - name: Update TWSE data page
        if: ${{ !cancelled() }}
        run: python scripts/twse_daily_update.py

      - name: Commit and push if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add futures-options/global-indices.md futures-options/twse-data.md scripts/state/global_indices_snapshot.json
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
          else
            git commit -m "chore: daily market data update"
            # The TAIFEX job pushes to the same branch; rebase once if it got there first.
            git push || { git pull --rebase origin master && git push; }
          fi
